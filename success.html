<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order received — DTF</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(620px,92vw);background:#111;border:1px solid #333;border-radius:20px;padding:38px;text-align:center}.logo{font-size:56px;font-weight:900;font-style:italic;color:#ff1682}h1{margin:12px 0}.status{color:#bbb;line-height:1.6}.ok{color:#ff1682;font-weight:900}a{display:inline-block;margin-top:22px;background:#ff1682;color:#fff;text-decoration:none;padding:13px 20px;border-radius:999px;font-weight:900}</style></head><body><div class="card"><div class="logo">DTF</div><h1>THANK YOU.</h1><p class="status" id="status">Confirming your payment…</p><a href="/">BACK TO THE SHOP</a></div><script>const id=new URLSearchParams(location.search).get('session_id'),el=document.querySelector('#status');if(!id){el.textContent='Your checkout is complete.'}else fetch('/api/checkout/session-status?id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.payment_status==='paid'){localStorage.removeItem('dtfCart');el.innerHTML=d.livemode?'<span class="ok">PAYMENT CONFIRMED.</span><br>Your order has been received and is moving into fulfillment.':'<span class="ok">TEST PAYMENT CONFIRMED.</span><br>Sandbox checkout completed successfully. No real order was sent to production.'}else el.textContent='Payment status: '+(d.payment_status||'processing')+'. We will not send the order to production until payment is confirmed.'}).catch(()=>el.textContent='Your checkout was submitted. Check your email for payment confirmation.');</script></body></html>
