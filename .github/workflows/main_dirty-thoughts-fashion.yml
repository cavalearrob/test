# Deploy the static Dirty Thoughts Fashion site to Azure App Service
name: Deploy DTF site to Azure Web App

concurrency:
  group: dtf-production
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E83696E5F9414CF797CE28CBB7F339BD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_59D78DF320054278AF2A5BDCC68B58BF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A7540AF8B4D544D286BCB8D5C4112A16 }}

      - name: Deploy static site to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: dirty-thoughts-fashion
          slot-name: Production
          package: .

      - name: Restart Azure Web App
        run: az webapp restart --name dirty-thoughts-fashion --resource-group rg-coorvanta-prod

      - name: Build remaining DTF Printify drafts
        if: contains(github.event.head_commit.message, '[build-dtf]')
        shell: bash
        run: |
          set -e
          BASE="https://dirty-thoughts-fashion-g7dhfpawe6esfef7.centralus-01.azurewebsites.net"
          sleep 20
          for START in 10 13 16 19 22 25 28 31 34 37; do
            END=$((START+3))
            if [ "$END" -gt 40 ]; then END=40; fi
            echo "Creating DTF products $((START+1))-$END"
            curl --fail --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 210 "$BASE/api/printify/build-drafts?run=1&start=$START&count=3"
            echo
          done

      - name: Repair DTF artwork
        if: contains(github.event.head_commit.message, '[repair-dtf]')
        shell: bash
        run: |
          set +e
          BASE="https://dirty-thoughts-fashion-g7dhfpawe6esfef7.centralus-01.azurewebsites.net"
          sleep 20
          FAIL=0
          for START in $(seq 0 39); do
            echo "Repairing DTF product $((START+1))/40"
            RESP=$(curl --fail --show-error --retry 1 --retry-delay 5 --retry-all-errors --max-time 150 "$BASE/api/printify/repair-artwork?run=1&start=$START&count=1")
            CODE=$?
            echo "$RESP"
            if [ "$CODE" -ne 0 ]; then
              echo "::warning::Product $((START+1)) request failed with curl exit $CODE; continuing."
              FAIL=1
            elif ! echo "$RESP" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "::warning::Product $((START+1)) returned an application-level repair failure; continuing."
              FAIL=1
            fi
          done
          exit $FAIL


      - name: Repair DTF panties
        if: contains(github.event.head_commit.message, '[repair-panties]')
        shell: bash
        run: |
          set -e
          BASE="https://dirty-thoughts-fashion-g7dhfpawe6esfef7.centralus-01.azurewebsites.net"
          sleep 25
          echo "Verifying deployed repair build"
          HEALTH=$(curl --fail --show-error --retry 3 --retry-delay 5 "$BASE/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | jq -e '.buildVersion == "clean-v4-panty-force-all"' >/dev/null
          for START in 35 36 37 38 39; do
            echo "Repairing DTF panty product $((START+1))/40"
            RESP=$(curl --fail --show-error --retry 1 --retry-delay 5 --retry-all-errors --max-time 150 "$BASE/api/printify/repair-artwork?run=1&start=$START&count=1")
            echo "$RESP"
            echo "$RESP" | jq -e '.ok == true' >/dev/null
          done
