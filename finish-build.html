<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finish DTF Product Build</title><style>body{font-family:system-ui;background:#0b0b0d;color:#fff;max-width:760px;margin:40px auto;padding:20px}button{background:#ff2b8a;color:white;border:0;border-radius:10px;padding:16px 22px;font-weight:800;font-size:18px}pre{white-space:pre-wrap;background:#17171b;padding:16px;border-radius:10px;min-height:120px}.ok{color:#65e6a4}.bad{color:#ff7d9f}</style></head><body><h1>Dirty Thoughts Fashion</h1><h2>Finish 40-product Printify build</h2><p>This runs products 11–40 in three safe batches. Existing products are skipped, so it is safe to resume.</p><button id="go">CREATE REMAINING DRAFTS</button><pre id="log">Ready.</pre><script>const log=document.querySelector('#log'),go=document.querySelector('#go');go.onclick=async()=>{go.disabled=true;let all=[];for(const start of [10,20,30]){log.textContent+='\n\nRunning products '+(start+1)+'–'+(start+10)+'…';try{const r=await fetch('/api/printify/build-drafts?run=1&start='+start+'&count=10');const d=await r.json();all.push(d);log.textContent+='\nCreated '+d.created+', skipped '+d.skipped+', failed '+d.failed;if(d.failed)log.textContent+='\n'+JSON.stringify(d.results.filter(x=>!x.ok),null,2)}catch(e){log.textContent+='\nERROR: '+e.message;break}}const failed=all.reduce((n,x)=>n+(x.failed||0),0);log.textContent+='\n\n'+(failed?'Finished with '+failed+' failure(s).':'SUCCESS — remaining DTF drafts created. Open the storefront to see live Printify mockups.');go.disabled=false}</script></body></html>
