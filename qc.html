<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTF Product QC</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:24px}h1{color:#ff1682;margin-bottom:4px}.sub{color:#aaa;margin-bottom:24px}.stats{position:sticky;top:0;background:#080808ee;padding:12px 0;z-index:3}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:12px}.card h3{font-size:14px;margin:10px 0 4px}.meta{font-size:11px;color:#999}.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.shots img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#222}.ok{color:#65e6a4}@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:8px}.shots{grid-template-columns:1fr}}</style></head><body><h1>DTF PRODUCT QC</h1><div class="sub">Live Printify draft mockups • internal review page</div><div class="stats" id="stats">Loading live catalog…</div><main class="grid" id="grid"></main><script>fetch('/api/store/catalog').then(r=>r.json()).then(d=>{if(!d.ok)throw Error('catalog');document.querySelector('#stats').innerHTML='<b class="ok">'+d.count+'/40 products connected</b> — review print placement, cropping, garment color and mockup angle below.';document.querySelector('#grid').innerHTML=d.products.map((p,i)=>'<article class="card"><div class="shots">'+(p.images||[]).slice(0,4).map(x=>'<img loading="lazy" src="'+x.src+'" alt="">').join('')+'</div><h3>'+(i+1)+'. '+p.name+'</h3><div class="meta">'+p.category+' • '+p.variants.length+' enabled variants • Printify '+p.id+'</div></article>').join('')}).catch(()=>document.querySelector('#stats').textContent='Could not load catalog. Refresh after deployment finishes.')</script></body></html>
